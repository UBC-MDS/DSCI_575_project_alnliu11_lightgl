# install with conda env create -f environment_no_cuda.yml
name: '575-project-query-no-cuda'
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python>=3.11,<3.13
  - numpy<2
  - pip
  - ipykernel
  - pandas
  - requests
  - faiss-cpu
  - rank-bm25
  - pyarrow
  - nltk
  - spacy
  - joblib
  - pytorch
  - cpuonly
  - pip:
    - python-dotenv
    - duckdb
    - langchain-core
    - langchain-community
    - langchain-huggingface
    - langchain_ollama
    - transformers==4.41.2
    - sentence-transformers==3.0.1
    - streamlit
