# install with conda env create -f environment.yml 
name: '575-project-query'
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python>=3.11,<3.13
  - numpy<2
  - pip
  - ipykernel
  - pandas
  - requests
  - faiss-cpu
  - rank-bm25
  - pyarrow
  - nltk
  - spacy
  - joblib
  - pytorch
  - pytorch-cuda=12.1
  - pip:
    - python-dotenv
    - duckdb
    - langchain-core
    - langchain-community
    - langchain-huggingface
    - langchain-groq
    - python-dotenv
    - huggingface-hub>=0.36.0
    - tokenizers
    - accelerate
    - transformers>=5.5.4,<6.0.0
    - sentence-transformers>=5.4.1,<6.0.0
    - sentencepiece
    - streamlit
